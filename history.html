<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PulseFit PRO - History & Fitness Tracker</title>
    <style>
        /* ==========================================
       DESIGN TOKENS & SYSTEM VARIABLES
       ========================================== */
        :root {
            /* Color Palette */
            --bg-base: #06080F;
            --bg-surface-1: rgba(18, 24, 38, 0.65);
            --bg-surface-2: rgba(30, 40, 62, 0.5);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-hover: rgba(255, 255, 255, 0.07);

            /* Glass Borders & Highlights */
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-bright: rgba(255, 255, 255, 0.18);
            --border-accent: rgba(139, 92, 246, 0.4);
            --inset-glow: inset 0 1px 1px rgba(255, 255, 255, 0.15);

            /* Vibrant Accents */
            --accent-purple: #8B5CF6;
            --accent-purple-glow: rgba(139, 92, 246, 0.4);
            --accent-cyan: #06B6D4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.35);
            --accent-gold: #F59E0B;
            --accent-gold-glow: rgba(245, 158, 11, 0.35);
            --accent-pink: #EC4899;
            --accent-green: #10B981;
            --accent-red: #EF4444;

            /* Neutral Text Hierarchy */
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            --text-muted: #475569;

            /* UI Constants */
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;

            --shadow-ambient: 0 20px 50px rgba(0, 0, 0, 0.6);
            --shadow-glow-purple: 0 8px 32px rgba(139, 92, 246, 0.25);

            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 0.2s;
            --duration-normal: 0.35s;
        }

        /* ==========================================
       RESET & BASE STYLES
       ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #020305;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ==========================================
       APP SHELL CONTAINER (MOBILE VIEWPORT)
       ========================================== */
        .app-shell {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background: var(--bg-base);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-ambient), 0 0 0 12px #111522;
            border-radius: 0px;
        }

        @media (min-height: 700px) and (min-width: 400px) {
            .app-shell {
                height: 92vh;
                border-radius: 44px;
            }
        }

        /* Ambient Background Light Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            animation: pulseOrb 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 260px;
            height: 260px;
            background: var(--accent-purple);
            top: -60px;
            right: -40px;
        }

        .orb-2 {
            width: 220px;
            height: 220px;
            background: var(--accent-cyan);
            bottom: 120px;
            left: -50px;
            opacity: 0.3;
        }

        @keyframes pulseOrb {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.15) translate(15px, 20px);
            }
        }

        /* ==========================================
       HEADER
       ========================================== */
        .app-header {
            position: relative;
            z-index: 10;
            padding: 24px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: var(--radius-full);
            background: var(--bg-surface-1);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--inset-glow);
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--bg-surface-2);
        }

        .icon-btn.gold-badge {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--accent-gold);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.2), var(--inset-glow);
        }

        /* ==========================================
       MAIN SCROLL AREA & TAB VIEWS
       ========================================== */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px 110px 20px;
            position: relative;
            z-index: 5;
            scrollbar-width: none;
        }

        .app-content::-webkit-scrollbar {
            display: none;
        }

        .tab-view {
            display: none;
            animation: viewFadeIn 0.3s var(--ease-spring);
        }

        .tab-view.active {
            display: block;
        }

        @keyframes viewFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================
       PROFILE PAGE STYLES (PRESERVED)
       ========================================== */
        .profile-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--inset-glow), 0 12px 30px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .profile-card:active {
            transform: scale(0.98);
            border-color: var(--border-glass-bright);
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            position: relative;
            width: 58px;
            height: 58px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-full);
            object-fit: cover;
            border: 2px solid var(--accent-purple);
            box-shadow: var(--shadow-glow-purple);
        }

        .status-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #10B981;
            border: 2.5px solid #06080F;
            border-radius: var(--radius-full);
        }

        .profile-meta .username {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-icon {
            color: var(--accent-cyan);
        }

        .profile-meta .workouts-count {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .chevron-icon {
            color: var(--text-tertiary);
            transition: transform var(--duration-fast);
        }

        .profile-card:hover .chevron-icon {
            transform: translateX(3px);
            color: var(--text-primary);
        }

        .dashboard-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .dashboard-title-row h2 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .add-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--border-accent);
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }

        .add-btn:active {
            transform: scale(0.9);
            background: var(--accent-purple);
            color: #FFF;
        }

        .widgets-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(22, 28, 45, 0.6) 0%, rgba(13, 17, 28, 0.7) 100%);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--inset-glow), 0 16px 36px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: cardSlideUp 0.4s var(--ease-spring);
        }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .widget-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .menu-dots-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 6px;
            margin: -6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--duration-fast);
        }

        .menu-dots-btn:hover {
            color: var(--text-primary);
        }

        .chart-box {
            height: 165px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-top: 20px;
        }

        .chart-y-axis {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .chart-y-axis span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .chart-grid {
            position: absolute;
            top: 6px;
            left: 0;
            right: 20px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .grid-line {
            width: 100%;
            border-top: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .chart-bars-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 110px;
            padding-right: 24px;
            z-index: 2;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            cursor: pointer;
        }

        .bar-track {
            width: 14px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 3px;
            position: relative;
        }

        .bar-segment {
            width: 100%;
            background: linear-gradient(180deg, var(--accent-purple) 0%, rgba(139, 92, 246, 0.6) 100%);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent-purple-glow);
            transition: height 0.8s var(--ease-spring), transform var(--duration-fast);
            height: 0%;
        }

        .bar-group:hover .bar-segment {
            transform: scaleX(1.2);
            filter: brightness(1.2);
        }

        .bar-date {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-tertiary);
        }

        .goal-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            margin-bottom: 12px;
        }

        .big-metric {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 8px;
        }

        .big-metric span {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            border-radius: var(--radius-full);
            box-shadow: 0 0 12px var(--accent-purple-glow);
            transition: width 0.8s var(--ease-spring);
        }

        .macro-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .macro-card-box {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 8px;
            text-align: center;
        }

        .macro-card-box .label {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .macro-card-box .val {
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* ==========================================
       HISTORY PAGE SPECIFIC STYLES
       ========================================== */
        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            height: 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 0 38px 0 42px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--duration-fast);
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            border-radius: var(--radius-full);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-fast);
        }

        .search-clear-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Filter Pills & Sorting Scroll */
        .filter-sort-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }

        .filter-sort-row::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 8px 14px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
            min-height: 36px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-pill.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            color: var(--text-primary);
            box-shadow: 0 0 12px var(--accent-purple-glow);
        }

        .sort-select-wrapper {
            position: relative;
            min-height: 36px;
        }

        .sort-select {
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-full);
            padding: 8px 30px 8px 14px;
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            height: 36px;
        }

        .sort-select-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            pointer-events: none;
        }

        /* Month Grouping & Workout Glass Cards */
        .month-group {
            margin-bottom: 24px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-primary);
        }

        .month-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-glass);
        }

        .workout-card {
            background: linear-gradient(135deg, rgba(22, 28, 45, 0.65) 0%, rgba(13, 17, 28, 0.75) 100%);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 18px 20px;
            margin-bottom: 14px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--inset-glow), 0 14px 32px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
            position: relative;
            overflow: hidden;
            animation: cardSlideUp 0.35s var(--ease-spring);
        }

        .workout-card:active {
            transform: scale(0.98);
            border-color: var(--border-glass-bright);
            background: rgba(30, 40, 62, 0.8);
        }

        .workout-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .workout-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            margin-bottom: 3px;
        }

        .workout-date {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .pr-tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-full);
        }

        /* Exercise summary inside cards */
        .workout-sets-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 14px;
        }

        .sets-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .exercise-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .exercise-summary-row:last-child {
            margin-bottom: 0;
        }

        .exercise-name-sets {
            color: var(--text-primary);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 65%;
        }

        .exercise-best-set {
            color: var(--accent-cyan);
            font-weight: 600;
            font-size: 12px;
        }

        /* Bottom stats row on card */
        .workout-stats-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .stat-item-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-item-inline svg {
            color: var(--text-tertiary);
        }

        .stat-item-inline.prs svg {
            color: var(--accent-gold);
        }

        /* Empty State */
        .empty-history-state {
            text-align: center;
            padding: 48px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-glass);
            border-radius: var(--radius-xl);
            margin-top: 20px;
        }

        .empty-icon-circle {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-full);
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }

        .empty-history-state h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .empty-history-state p {
            font-size: 13px;
            color: var(--text-tertiary);
            max-width: 240px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Calendar Bottom Sheet Component */
        .calendar-grid-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calendar-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .calendar-month-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .calendar-days-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .calendar-days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
            transition: all var(--duration-fast);
        }

        .cal-day-cell.empty {
            background: transparent;
            cursor: default;
        }

        .cal-day-cell:not(.empty):active {
            transform: scale(0.9);
        }

        .cal-day-cell.has-workout {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
            color: var(--text-primary);
        }

        .cal-workout-dot {
            width: 4px;
            height: 4px;
            border-radius: var(--radius-full);
            background: var(--accent-cyan);
            box-shadow: 0 0 6px var(--accent-cyan);
            margin-top: 2px;
        }

        .cal-day-cell.selected {
            background: var(--accent-purple) !important;
            color: #FFF !important;
            box-shadow: var(--shadow-glow-purple);
        }

        .cal-day-cell.selected .cal-workout-dot {
            background: #FFF;
        }

        /* Detailed Workout Sheet Components */
        .workout-detail-header {
            margin-bottom: 20px;
        }

        .workout-detail-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .workout-detail-date {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .workout-detail-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .detail-stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px 10px;
            text-align: center;
        }

        .detail-stat-box .val {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 2px;
        }

        .detail-stat-box .lbl {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            font-weight: 700;
        }

        .exercise-detail-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
        }

        .exercise-detail-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .exercise-set-row:last-child {
            border-bottom: none;
        }

        .set-num {
            color: var(--text-tertiary);
            font-weight: 600;
            width: 50px;
        }

        .set-weight-reps {
            color: var(--text-primary);
            font-weight: 700;
        }

        .pr-star {
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
        }

        .workout-notes-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 20px;
        }

        /* ==========================================
       FLOATING GLASS BOTTOM NAVIGATION DOCK
       ========================================== */
        .bottom-nav-dock {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            height: 68px;
            background: rgba(15, 20, 32, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass-bright);
            border-radius: var(--radius-full);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), var(--inset-glow);
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            width: 58px;
            padding: 8px 0;
            position: relative;
            transition: color var(--duration-fast);
        }

        .nav-tab svg {
            transition: transform var(--duration-fast) var(--ease-spring), color var(--duration-fast);
        }

        .nav-tab span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: -0.1px;
        }

        .nav-tab.active {
            color: var(--accent-purple);
        }

        .nav-tab.active svg {
            transform: translateY(-2px);
            color: var(--accent-purple);
        }

        .active-dot {
            position: absolute;
            bottom: 6px;
            width: 4px;
            height: 4px;
            background: var(--accent-purple);
            border-radius: var(--radius-full);
            box-shadow: 0 0 8px var(--accent-purple);
        }

        /* ==========================================
       MODALS & BOTTOM SHEETS
       ========================================== */
        .sheet-overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 4, 8, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-normal) var(--ease-spring);
        }

        .sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0E1322;
            border-top: 1px solid var(--border-glass-bright);
            border-radius: 32px 32px 0 0;
            padding: 12px 24px 36px 24px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform var(--duration-normal) var(--ease-spring);
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.8);
            max-height: 82vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .bottom-sheet-drawer::-webkit-scrollbar {
            display: none;
        }

        .sheet-overlay.active .bottom-sheet-drawer {
            transform: translateY(0);
        }

        .drag-pill {
            width: 38px;
            height: 5px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: var(--radius-full);
            margin: 0 auto 20px auto;
        }

        .sheet-header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        /* Form Fields */
        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .text-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color var(--duration-fast);
        }

        .text-input:focus {
            border-color: var(--accent-purple);
        }

        .primary-action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #7C3AED 100%);
            color: #FFF;
            border: none;
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-glow-purple);
            transition: all var(--duration-fast) var(--ease-spring);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-action-btn:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        /* Option Items in Sheets */
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background var(--duration-fast);
        }

        .option-card:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .option-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .option-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .action-row-btn {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background var(--duration-fast);
        }

        .action-row-btn:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .action-row-btn.danger {
            color: #EF4444;
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* Confirm Modal Box */
        .confirm-box {
            text-align: center;
            padding: 10px 0;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .confirm-btn-group {
            display: flex;
            gap: 12px;
        }

        .secondary-btn {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .danger-btn {
            flex: 1;
            padding: 14px;
            background: var(--accent-red);
            border: none;
            border-radius: var(--radius-md);
            color: #FFF;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }

        /* ==========================================
       TOAST NOTIFICATION
       ========================================== */
        .floating-toast {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(30, 40, 60, 0.9);
            border: 1px solid var(--border-glass-bright);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s var(--ease-spring);
            white-space: nowrap;
        }

        .floating-toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- APP SHELL -->
    <div class="app-shell">

        <!-- Ambient Blur Lighting Orbs -->
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>

        <!-- Floating Toast Capsule -->
        <div id="app-toast" class="floating-toast">Coming next</div>

        <!-- APP HEADER (DYNAMICALLY UPDATED BY ACTIVE TAB) -->
        <header class="app-header">
            <h1 id="page-title">History</h1>
            <div class="header-actions" id="header-actions">
                <!-- Dynamically populated per page -->
            </div>
        </header>

        <!-- SCROLLABLE BODY CONTENT -->
        <main class="app-content">

            <!-- PAGE 1: PROFILE TAB -->
            <div id="tab-profile" class="tab-view">
                <!-- PROFILE IDENTITY CARD -->
                <div class="profile-card" id="profile-trigger" aria-label="Edit Profile">
                    <div class="profile-left">
                        <div class="avatar-container">
                            <img id="user-avatar-img"
                                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250"
                                alt="Avatar" class="avatar-img">
                            <div class="status-indicator"></div>
                        </div>
                        <div class="profile-meta">
                            <div class="username">
                                <span id="user-name-txt">SKV</span>
                                <svg class="verified-icon" width="16" height="16" viewBox="0 0 24 24"
                                    fill="currentColor">
                                    <path
                                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                                </svg>
                            </div>
                            <div class="workouts-count"><span id="user-workouts-txt">246</span> workouts</div>
                        </div>
                    </div>
                    <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </div>

                <!-- DASHBOARD SECTION -->
                <div class="dashboard-title-row">
                    <h2>Dashboard</h2>
                    <button class="add-btn" id="open-add-widget-btn" aria-label="Add Widget">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>

                <!-- WIDGETS CONTAINER -->
                <div class="widgets-stack" id="widgets-container">
                    <!-- Rendered dynamically -->
                </div>
            </div>

            <!-- PAGE 2: HISTORY TAB -->
            <div id="tab-history" class="tab-view active">

                <!-- SEARCH & SEARCH ACTIONS -->
                <div class="search-container">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="history-search-input" class="search-input"
                        placeholder="Search workout, exercise, date...">
                    <button id="history-search-clear" class="search-clear-btn" aria-label="Clear Search">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- FILTER PILLS & SORTING ROW -->
                <div class="filter-sort-row">
                    <button class="filter-pill active" data-filter="all">All</button>
                    <button class="filter-pill" data-filter="this-week">This week</button>
                    <button class="filter-pill" data-filter="this-month">This month</button>
                    <button class="filter-pill" data-filter="prev-month">Previous month</button>
                    <button class="filter-pill" data-filter="prs">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16v-2H4v2zm2-13h12v3a6 6 0 0 1-12 0V9z" />
                        </svg> PRs
                    </button>
                    <button class="filter-pill" data-filter="high-volume">Highest Volume</button>

                    <div class="sort-select-wrapper">
                        <select id="history-sort-select" class="sort-select">
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="highest-vol">Highest volume</option>
                            <option value="longest">Longest workout</option>
                            <option value="most-prs">Most PRs</option>
                        </select>
                        <svg class="sort-select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </div>
                </div>

                <!-- CHRONOLOGICAL WORKOUT CONTAINER -->
                <div id="workout-history-feed">
                    <!-- Dynamic Month Groups & Cards rendered here -->
                </div>

            </div>

        </main>

        <!-- FLOATING BOTTOM NAVIGATION DOCK -->
        <nav class="bottom-nav-dock">
            <button class="nav-tab" data-tab="profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span>Profile</span>
            </button>
            <button class="nav-tab active" data-tab="history">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span>History</span>
                <div class="active-dot"></div>
            </button>
            <button class="nav-tab" data-tab="workout">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>Workout</span>
            </button>
            <button class="nav-tab" data-tab="exercises">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6.5 6.5 11 11" />
                    <path d="m21 21-1-1" />
                    <path d="m3 3 1 1" />
                    <path d="m18 22 4-4" />
                    <path d="m2 6 4-4" />
                    <path d="m3 10 7-7" />
                    <path d="m14 21 7-7" />
                </svg>
                <span>Exercises</span>
            </button>
            <button class="nav-tab" data-tab="measure">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0l12.6 12.6z" />
                    <line x1="14.5" y1="12.5" x2="17" y2="10" />
                    <line x1="11.5" y1="9.5" x2="14" y2="7" />
                    <line x1="8.5" y1="6.5" x2="11" y2="4" />
                </svg>
                <span>Measure</span>
            </button>
        </nav>

        <!-- SHEET OVERLAY & BACKDROP -->
        <div class="sheet-overlay" id="sheet-backdrop">

            <!-- EDIT PROFILE SHEET -->
            <div class="bottom-sheet-drawer" id="sheet-edit-profile" onclick="event.stopPropagation()">
                <div class="drag-pill"></div>
                <div class="sheet-header-title">Edit Profile</div>
                <form id="form-profile" onsubmit="event.preventDefault(); app.saveProfile();">
                    <div class="input-group">
                        <label class="input-label" for="field-username">Username</label>
                        <input type="text" id="field-username" class="text-input" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="field-workouts">Total Workouts</label>
                        <input type="number" id="field-workouts" class="text-input" min="0" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="field-avatar">Avatar Image URL</label>
                        <input type="url" id="field-avatar" class="text-input" required>
                    </div>
                    <button type="submit" class="primary-action-btn">Save Changes</button>
                </form>
            </div>

            <!-- ADD WIDGET SHEET -->
            <div class="bottom-sheet-drawer" id="sheet-add-widget" onclick="event.stopPropagation()">
                <div class="drag-pill"></div>
                <div class="sheet-header-title">Add Widget</div>
                <div class="option-list" id="available-widgets-list">
                    <!-- Dynamic widget options -->
                </div>
            </div>

            <!-- WIDGET OPTIONS POPUP SHEET -->
            <div class="bottom-sheet-drawer" id="sheet-widget-menu" onclick="event.stopPropagation()">
                <div class="drag-pill"></div>
                <div class="sheet-header-title" id="widget-menu-title">Widget Settings</div>
                <button class="action-row-btn" onclick="app.openGoalModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg>

        class PulseFitApp {
            constructor() {
                this.initDOM();
                this.state = this.loadState();
                this.selectedWidget = null;
                this.activeWorkoutId = null;
                this.activeTab = 'history'; // History tab active by default
                this.toastTimer = null;

                this.calViewMonth = 7; // August (0-indexed)

                this.bindEvents();
                this.renderAll();
                this.switchTab('history');

            loadState() {
                try {
                    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (!raw) return JSON.parse(JSON.stringify(INITIAL_STATE));
                    const parsed = JSON.parse(raw);
                    return {
                        user: { ...INITIAL_STATE.user, ...(parsed.user || {}) },
                        widgets: Array.isArray(parsed.widgets) ? parsed.widgets : INITIAL_STATE.widgets,
                        goals: parsed.goals || {},
                        workouts: Array.isArray(parsed.workouts) && parsed.workouts.length > 0 ? parsed.workouts : INITIAL_WORKOUTS,
                        filter: parsed.filter || 'all',
                        sort: parsed.sort || 'newest',
                        searchQuery: ''
                    };
                } catch (e) {
                    return JSON.parse(JSON.stringify(INITIAL_STATE));
                }
            }

            saveState() {
                try {
                    const toSave = {
                        user: this.state.user,
                        widgets: this.state.widgets,
                        goals: this.state.goals,
                        workouts: this.state.workouts,
                        filter: this.state.filter,
                        sort: this.state.sort
                    };
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) {
                    console.error('Storage save error:', e);
                }

            initDOM() {
                this.backdrop = document.getElementById('sheet-backdrop');

                    widgetMenu: document.getElementById('sheet-widget-menu'),

                    deleteConfirm: document.getElementById('sheet-delete-confirm')

                this.toastEl = document.getElementById('app-toast');
                this.historyFeed = document.getElementById('workout-history-feed');
                this.searchInput = document.getElementById('history-search-input');
                this.searchClearBtn = document.getElementById('history-search-clear');
                this.sortSelect = document.getElementById('history-sort-select');
            }

            bindEvents() {
                // Profile events
                document.getElementById('profile-trigger').addEventListener('click', () => this.openEditProfile());
                document.getElementById('open-add-widget-btn').addEventListener('click', () => this.openAddWidgetSheet());

                // Overlay & modal backdrop dismiss
                this.backdrop.addEventListener('click', () => this.closeSheets());
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.closeSheets();
                });

                // Tab Switcher
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const targetTab = tab.dataset.tab;
                        if (targetTab === 'profile' || targetTab === 'history') {
                            this.switchTab(targetTab);
                        } else {
                            this.showToast('Coming next');
                        }
                    });
                });

                // Filter pills
                document.querySelectorAll('.filter-pill').forEach(pill => {
                    pill.addEventListener('click', (e) => {
                        const btn = e.currentTarget;
                        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                        btn.classList.add('active');
                        this.state.filter = btn.dataset.filter;
                        this.saveState();
                        this.renderHistory();
                    });
                });

                // Sorting select dropdown
                this.sortSelect.value = this.state.sort;
                this.sortSelect.addEventListener('change', (e) => {
                    this.state.sort = e.target.value;
                    this.saveState();
                    this.renderHistory();
                });

                // Search input
                this.searchInput.addEventListener('input', (e) => {
                    this.state.searchQuery = e.target.value.trim().toLowerCase();
                    if (this.state.searchQuery.length > 0) {
                        this.searchClearBtn.classList.add('visible');
                    } else {
                        this.searchClearBtn.classList.remove('visible');
                    }
                    this.renderHistory();
                });

                this.searchClearBtn.addEventListener('click', () => {
                    this.searchInput.value = '';
                    this.state.searchQuery = '';
                    this.searchClearBtn.classList.remove('visible');
                    this.renderHistory();
                });
            }

            switchTab(tabKey) {
                this.activeTab = tabKey;

                // Toggle tabs visual active state
                document.querySelectorAll('.nav-tab').forEach(t => {
                    t.classList.toggle('active', t.dataset.tab === tabKey);
                    const dot = t.querySelector('.active-dot');
                    if (dot) dot.remove();
                    if (t.dataset.tab === tabKey) {
                        const d = document.createElement('div');
                        d.className = 'active-dot';
                        t.appendChild(d);
                    }
                });

                // Toggle content view active
                document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
                const view = document.getElementById(`tab-${tabKey}`);
                if (view) view.classList.add('active');

                // Render dynamic Header based on Tab
                const headerTitle = document.getElementById('page-title');
                const headerActions = document.getElementById('header-actions');

                if (tabKey === 'profile') {
