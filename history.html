                    headerActions.innerHTML = `
            <button class="icon-btn" aria-label="Settings" onclick="app.showToast('Settings panel')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="icon-btn gold-badge" aria-label="PRO Member" onclick="app.showToast('PRO Membership Active')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m2 4 3 12h14l3-12-6 7-4-5-4 5-6-7zm3 16h14"/>
              </svg>
            </button>
          `;
                } else if (tabKey === 'history') {
                    headerTitle.textContent = 'History';
                    headerActions.innerHTML = `
            <button class="icon-btn" aria-label="Calendar" onclick="app.openCalendarSheet()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </button>
          `;
                }
            }

            renderAll() {
                this.renderProfile();
                this.renderWidgets();
                this.renderHistory();
            }

            renderProfile() {
                // Synchronize workouts count with actual stored workouts history length
                const actualCount = this.state.workouts.length;
                this.state.user.workouts = actualCount;

                document.getElementById('user-name-txt').textContent = this.state.user.username;
                document.getElementById('user-workouts-txt').textContent = actualCount;
                document.getElementById('user-avatar-img').src = this.state.user.avatarUrl;
            }

            renderWidgets() {
                const container = document.getElementById('widgets-container');
                container.innerHTML = '';

                if (!this.state.widgets || this.state.widgets.length === 0) {
                    container.innerHTML = `
            <div style="text-align:center; padding: 36px 20px; background: rgba(255,255,255,0.02); border: 1px dashed var(--border-glass); border-radius: var(--radius-lg); color: var(--text-tertiary);">
              <p>No widgets active.</p>
              <button onclick="app.openAddWidgetSheet()" style="margin-top: 10px; background: none; border: none; color: var(--accent-purple); font-weight: 700; cursor: pointer;">+ Add Widget</button>
            </div>
          `;
                    return;
                }

                this.state.widgets.forEach(id => {
                    const item = WIDGET_REGISTRY[id];
                    if (!item) return;

                    const card = document.createElement('div');
                    card.className = 'glass-card';
                    const goal = (this.state.goals && this.state.goals[id]) || null;
                    card.innerHTML = item.render(goal);
                    container.appendChild(card);
                });

                setTimeout(() => {
                    document.querySelectorAll('.bar-segment').forEach(bar => {
                        const h = bar.getAttribute('data-h');
                        if (h) bar.style.height = h;
                    });
                }, 60);
            }

            /* ==========================================
               HISTORY LOGIC & RENDERING
               ========================================== */
            renderHistory() {
                // Filter pill state visual update
                document.querySelectorAll('.filter-pill').forEach(pill => {
                    pill.classList.toggle('active', pill.dataset.filter === this.state.filter);
                });

                let list = [...this.state.workouts];

                // 1. Apply Filtering
                const now = new Date('2026-08-17T23:29:00'); // Fixed 2026 reference date
                if (this.state.filter === 'this-week') {
                    list = list.filter(w => {
                        const d = new Date(w.isoDate);
                        const diffDays = (now - d) / (1000 * 3600 * 24);
                        return diffDays >= 0 && diffDays <= 7;
                    });
                } else if (this.state.filter === 'this-month') {
                    list = list.filter(w => {
                        const d = new Date(w.isoDate);
                        return d.getFullYear() === 2026 && d.getMonth() === 7; // August
                    });
                } else if (this.state.filter === 'prev-month') {
                    list = list.filter(w => {
                        const d = new Date(w.isoDate);
                        return d.getFullYear() === 2026 && d.getMonth() === 6; // July
                    });
                } else if (this.state.filter === 'prs') {
                    list = list.filter(w => w.prs > 0);
                } else if (this.state.filter === 'high-volume') {
                    list = list.filter(w => w.volumeVal >= 2000);
                }

                // 2. Apply Search
                if (this.state.searchQuery) {
                    const q = this.state.searchQuery;
                    list = list.filter(w => {
                        const nameMatch = w.title.toLowerCase().includes(q);
                        const dateMatch = w.dateStr.toLowerCase().includes(q);
                        const exerciseMatch = w.exercises.some(ex => ex.name.toLowerCase().includes(q));
                        return nameMatch || dateMatch || exerciseMatch;
                    });
                }

                // 3. Apply Sorting
                const s = this.state.sort;
                list.sort((a, b) => {
                    if (s === 'newest') return new Date(b.isoDate) - new Date(a.isoDate);
                    if (s === 'oldest') return new Date(a.isoDate) - new Date(b.isoDate);
                    if (s === 'highest-vol') return b.volumeVal - a.volumeVal;
                    if (s === 'longest') return b.durationMin - a.durationMin;
                    if (s === 'most-prs') return b.prs - a.prs;
                    return 0;
                });

                // 4. Render Feed Output
                this.historyFeed.innerHTML = '';

                if (list.length === 0) {
                    this.historyFeed.innerHTML = `
            <div class="empty-history-state">
              <div class="empty-icon-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </div>
              <h3>No workouts found</h3>
              <p>Try another search or change your filters.</p>
            </div>
          `;
                    return;
                }

                // Group chronologically by Month (e.g. August, July)
                const monthGroups = {};
                list.forEach(w => {
                    const dateObj = new Date(w.isoDate);
                    const monthName = dateObj.toLocaleString('en-US', { month: 'long' });
                    if (!monthGroups[monthName]) monthGroups[monthName] = [];
                    monthGroups[monthName].push(w);
                });

                Object.keys(monthGroups).forEach(monthName => {
                    const groupWorkouts = monthGroups[monthName];
                    const groupEl = document.createElement('div');
                    groupEl.className = 'month-group';

                    groupEl.innerHTML = `
            <div class="month-header">
              <div class="month-title">${escapeHtml(monthName)}</div>
              <div class="month-count">${groupWorkouts.length} ${groupWorkouts.length === 1 ? 'workout' : 'workouts'}</div>
            </div>
          `;

                    groupWorkouts.forEach(w => {
                        const card = document.createElement('div');
                        card.className = 'workout-card';
                        card.onclick = () => this.openWorkoutDetail(w.id);

                        let exercisesHtml = '';
                        w.exercises.forEach(ex => {
                            exercisesHtml += `
                <div class="exercise-summary-row">
                  <span class="exercise-name-sets">${ex.setsCount} × ${escapeHtml(ex.name)}</span>
                  <span class="exercise-best-set">${escapeHtml(ex.bestSet)}</span>
                </div>
              `;
                        });

                        card.innerHTML = `
              <div class="workout-card-top">
                <div>
                  <div class="workout-title">${escapeHtml(w.title)}</div>
                  <div class="workout-date">${escapeHtml(w.dateStr)}</div>
                </div>
                ${w.prs > 0 ? `<div class="pr-tag-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16v-2H4v2zm2-13h12v3a6 6 0 0 1-12 0V9z"/></svg> ${w.prs} PRs</div>` : ''}
              </div>

              <div class="workout-sets-section">
                <div class="sets-label">Sets</div>
                ${exercisesHtml}
              </div>

              <div class="workout-stats-footer">
                <div class="stat-item-inline">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${escapeHtml(w.duration)}
                </div>
                <div class="stat-item-inline">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
                  ${escapeHtml(w.volume)}
                </div>
                <div class="stat-item-inline prs">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16v-2H4v2zm2-13h12v3a6 6 0 0 1-12 0V9z"/></svg>
                  ${w.prs} PRs
                </div>
              </div>
            `;
                        groupEl.appendChild(card);
                    });

                    this.historyFeed.appendChild(groupEl);
                });
            }

            /* ==========================================
               CALENDAR SHEET LOGIC
               ========================================== */
            openCalendarSheet() {
                this.renderCalendar();
                this.openSheet('calendar');
            }

            navigateCalendar(dir) {
                this.calViewMonth += dir;
                if (this.calViewMonth < 0) {
                    this.calViewMonth = 11;
                    this.calViewYear--;
                } else if (this.calViewMonth > 11) {
                    this.calViewMonth = 0;
                    this.calViewYear++;
                }
                this.renderCalendar();
            }

            renderCalendar() {
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                document.getElementById('calendar-month-label').textContent = `${monthNames[this.calViewMonth]} ${this.calViewYear}`;

                const container = document.getElementById('calendar-days-container');
                container.innerHTML = '';

                const firstDay = new Date(this.calViewYear, this.calViewMonth, 1).getDay();
                const daysInMonth = new Date(this.calViewYear, this.calViewMonth + 1, 0).getDate();

                // Get array of completed workout dates string 'YYYY-MM-DD'
                const completedDates = this.state.workouts.map(w => w.isoDate.split('T')[0]);

                // Pad leading empty cells
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'cal-day-cell empty';
                    container.appendChild(emptyCell);
                }

                // Render day cells
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayFormatted = String(day).padStart(2, '0');
                    const monthFormatted = String(this.calViewMonth + 1).padStart(2, '0');
                    const dateIso = `${this.calViewYear}-${monthFormatted}-${dayFormatted}`;

                    const cell = document.createElement('div');
                    cell.className = 'cal-day-cell';
                    cell.textContent = day;

                    const hasWorkout = completedDates.includes(dateIso);
                    if (hasWorkout) {
                        cell.classList.add('has-workout');
                        const dot = document.createElement('div');
                        dot.className = 'cal-workout-dot';
                        cell.appendChild(dot);
                    }

                    cell.onclick = () => {
                        document.querySelectorAll('.cal-day-cell').forEach(c => c.classList.remove('selected'));
                        cell.classList.add('selected');

                        if (hasWorkout) {
                            const matched = this.state.workouts.find(w => w.isoDate.startsWith(dateIso));
                            if (matched) {
                                setTimeout(() => {
                                    this.openWorkoutDetail(matched.id);
                                }, 150);
                            }
                        } else {
                            this.showToast(`No workout on ${monthNames[this.calViewMonth]} ${day}`);
                        }
                    };

                    container.appendChild(cell);
                }
            }

            /* ==========================================
               WORKOUT DETAIL SHEET & ACTIONS
               ========================================== */
            openWorkoutDetail(id) {
                this.activeWorkoutId = id;
                const workout = this.state.workouts.find(w => w.id === id);
                if (!workout) return;

                const detailContainer = document.getElementById('workout-detail-content');

                let exercisesMarkup = '';
                workout.exercises.forEach(ex => {
                    let setsRows = '';
                    ex.sets.forEach(s => {
                        setsRows += `
              <div class="exercise-set-row">
                <span class="set-num">SET ${s.setNum}</span>
                <span class="set-weight-reps">${escapeHtml(s.weight)} × ${s.reps} reps</span>
                ${s.isPr ? `<span class="pr-star">★ PR</span>` : `<span></span>`}
              </div>
            `;
                    });

                    exercisesMarkup += `
            <div class="exercise-detail-card">
              <div class="exercise-detail-name">
                <span>${escapeHtml(ex.name)}</span>
                <span style="font-size:12px; color:var(--accent-cyan);">${escapeHtml(ex.bestSet)}</span>
              </div>
              <div>${setsRows}</div>
            </div>
          `;
                });

                detailContainer.innerHTML = `
          <div class="workout-detail-header">
            <div class="workout-detail-title">${escapeHtml(workout.title)}</div>
            <div class="workout-detail-date">${escapeHtml(workout.dateStr)}</div>
          </div>

          <div class="workout-detail-stats-grid">
            <div class="detail-stat-box">
              <div class="lbl">Duration</div>
              <div class="val">${escapeHtml(workout.duration)}</div>
            </div>
            <div class="detail-stat-box">
              <div class="lbl">Volume</div>
              <div class="val">${escapeHtml(workout.volume)}</div>
            </div>
            <div class="detail-stat-box">
              <div class="lbl">PRs</div>
              <div class="val" style="color:var(--accent-gold);">${workout.prs}</div>
            </div>
          </div>

          ${workout.notes ? `<div class="workout-notes-box">"${escapeHtml(workout.notes)}"</div>` : ''}

          <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-tertiary); margin-bottom:12px;">Completed Exercises</div>
          ${exercisesMarkup}

          <div style="margin-top:24px; display:flex; flex-direction:column; gap:8px;">
            <button class="action-row-btn" onclick="app.editActiveWorkout()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit Workout
            </button>
            <button class="action-row-btn" onclick="app.duplicateActiveWorkout()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Duplicate Workout
            </button>
            <button class="action-row-btn danger" onclick="app.promptDeleteWorkout()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Delete Workout
            </button>
          </div>
        `;

                this.openSheet('workoutDetail');
            }

            editActiveWorkout() {
                this.closeSheets();
                this.showToast('Edit mode enabled');
            }

            duplicateActiveWorkout() {
                const original = this.state.workouts.find(w => w.id === this.activeWorkoutId);
                if (!original) return;

                const duplicated = JSON.parse(JSON.stringify(original));
                duplicated.id = 'w-' + Date.now();
                duplicated.title = original.title + ' (Copy)';
                duplicated.dateStr = 'Today at 6:00 PM';
                duplicated.isoDate = new Date().toISOString();

                this.state.workouts.unshift(duplicated);
                this.saveState();
                this.renderAll();
                this.closeSheets();
                this.showToast('Workout duplicated');
            }

            promptDeleteWorkout() {
                this.openSheet('deleteConfirm');
            }

            confirmDeleteWorkout() {
                if (!this.activeWorkoutId) return;

                this.state.workouts = this.state.workouts.filter(w => w.id !== this.activeWorkoutId);
                this.saveState();
                this.renderAll();
                this.closeSheets();
                this.showToast('Workout deleted');
            }

            /* ==========================================
               PROFILE SHEET HELPERS & OVERLAY LOGIC
               ========================================== */
            openSheet(sheetKey) {
                this.backdrop.classList.add('active');
                Object.keys(this.sheets).forEach(key => {
                    this.sheets[key].style.display = (key === sheetKey) ? 'block' : 'none';
                });
            }

            closeSheets() {
                this.backdrop.classList.remove('active');
            }

            showToast(msg) {
                if (this.toastTimer) clearTimeout(this.toastTimer);
                this.toastEl.textContent = msg;
                this.toastEl.classList.add('visible');
                this.toastTimer = setTimeout(() => {
                    this.toastEl.classList.remove('visible');
                }, 2200);
            }

            openEditProfile() {
                document.getElementById('field-username').value = this.state.user.username;
                document.getElementById('field-workouts').value = this.state.user.workouts;
                document.getElementById('field-avatar').value = this.state.user.avatarUrl;
                this.openSheet('editProfile');
            }

            saveProfile() {
                const username = document.getElementById('field-username').value.trim();
                const workouts = parseInt(document.getElementById('field-workouts').value, 10);
                const avatarUrl = document.getElementById('field-avatar').value.trim();

                if (username && !isNaN(workouts) && avatarUrl) {
                    this.state.user = { username, workouts, avatarUrl };
                    this.saveState();
                    this.renderProfile();
                    this.closeSheets();
                    this.showToast('Profile saved');
                }
            }

            openAddWidgetSheet() {
                const list = document.getElementById('available-widgets-list');
                list.innerHTML = '';

                const unadded = Object.keys(WIDGET_REGISTRY).filter(id => !this.state.widgets.includes(id));

                if (unadded.length === 0) {
                    list.innerHTML = `<p style="text-align:center; color:var(--text-tertiary); padding:16px 0; font-size:14px;">All widgets added to dashboard.</p>`;
                } else {
                    unadded.forEach(id => {
                        const w = WIDGET_REGISTRY[id];
                        const opt = document.createElement('div');
                        opt.className = 'option-card';
                        opt.onclick = () => this.addWidget(id);
                        opt.innerHTML = `
              <div>
                <div class="option-title">${w.name}</div>
                <div class="option-sub">${w.description}</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            `;
                        list.appendChild(opt);
                    });
                }

                this.openSheet('addWidget');
            }

            addWidget(id) {
                if (!this.state.widgets.includes(id)) {
                    this.state.widgets.push(id);
                    this.saveState();
                    this.renderWidgets();
                    this.closeSheets();
                    this.showToast('Widget added');
                }
            }

            openWidgetMenu(id) {
                this.selectedWidget = id;
                const w = WIDGET_REGISTRY[id];
                document.getElementById('widget-menu-title').textContent = w ? w.name : 'Options';
                this.openSheet('widgetMenu');
            }

            deleteSelectedWidget() {
                if (!this.selectedWidget) return;
                this.state.widgets = this.state.widgets.filter(id => id !== this.selectedWidget);
                if (this.state.goals) delete this.state.goals[this.selectedWidget];
                this.saveState();
                this.renderWidgets();
                this.closeSheets();
                this.showToast('Widget deleted');
            }

            openGoalModal() {
                const currentGoal = (this.state.goals && this.state.goals[this.selectedWidget]) || '';
                document.getElementById('field-goal').value = currentGoal;
                this.openSheet('setGoal');
            }

            saveGoal() {
                const val = document.getElementById('field-goal').value.trim();
                if (this.selectedWidget) {
                    if (!this.state.goals) this.state.goals = {};
                    if (val) {
                        this.state.goals[this.selectedWidget] = val;
                    } else {
                        delete this.state.goals[this.selectedWidget];
                    }
                    this.saveState();
                    this.renderWidgets();
                    this.closeSheets();
                    this.showToast('Goal updated');
                }
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new PulseFitApp();
        });
    </script>
</body>

</html>
